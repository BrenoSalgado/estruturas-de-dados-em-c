name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - run: make test CC=${{ matrix.cc }}

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make test CC=clang CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

  valgrind:
    name: Valgrind (vazamentos de memória)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: make all CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O0 -g"
      - run: |
          for t in build/teste_*; do
            valgrind --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all --error-exitcode=1 -q "$t"
          done
